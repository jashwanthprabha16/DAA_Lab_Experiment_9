<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Packing Approximation Algorithms</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2c3e50;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#0078d7;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#005cbf;
}

.section{
    margin-top:25px;
    background:#eef7ff;
    padding:15px;
    border-radius:8px;
}

.bin{
    margin:12px 0;
}

.progress{
    width:100%;
    height:22px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#28a745;
    color:white;
    text-align:center;
    line-height:22px;
    font-size:13px;
}

.summary{
    margin-top:25px;
    background:#dff0d8;
    padding:15px;
    border-radius:8px;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>Bin Packing using Approximation Algorithms</h1>

<label>Enter Item Sizes (comma separated)</label>

<input
id="items"
value="0.5,0.7,0.3,0.9,0.2,0.6,0.8,0.4,0.1,0.5">

<label>Bin Capacity</label>

<input
id="capacity"
value="1.0">

<button onclick="solve()">Run Algorithms</button>

<div id="output"></div>

</div>

<script>

function firstFit(items,capacity){

    let space=[];
    let bins=[];

    for(let item of items){

        let placed=false;

        for(let i=0;i<space.length;i++){

            if(space[i]>=item){

                space[i]-=item;
                bins[i].push(item);
                placed=true;
                break;

            }

        }

        if(!placed){

            space.push(capacity-item);
            bins.push([item]);

        }

    }

    return bins;

}

function firstFitDecreasing(items,capacity){

    let sorted=[...items].sort((a,b)=>b-a);

    return firstFit(sorted,capacity);

}

function bestFitDecreasing(items,capacity){

    let sorted=[...items].sort((a,b)=>b-a);

    let space=[];
    let bins=[];

    for(let item of sorted){

        let best=-1;
        let remain=Infinity;

        for(let i=0;i<space.length;i++){

            if(space[i]>=item && space[i]-item<remain){

                remain=space[i]-item;
                best=i;

            }

        }

        if(best!=-1){

            space[best]-=item;
            bins[best].push(item);

        }
        else{

            space.push(capacity-item);
            bins.push([item]);

        }

    }

    return bins;

}

function display(title,bins,capacity){

    let html="<div class='section'>";

    html+="<h2>"+title+"</h2>";

    html+="<b>Total Bins : "+bins.length+"</b><br><br>";

    bins.forEach((bin,index)=>{

        let used=bin.reduce((a,b)=>a+b,0);

        let percent=(used/capacity)*100;

        html+="<div class='bin'>";

        html+="<b>Bin "+(index+1)+"</b><br>";

        html+="Items : "+bin.join(", ")+"<br>";

        html+="Used : "+used.toFixed(2)+" / "+capacity+"<br>";

        html+="<div class='progress'>";

        html+="<div class='fill' style='width:"+percent+"%'>";

        html+=percent.toFixed(0)+"%";

        html+="</div></div>";

        html+="</div>";

    });

    html+="</div>";

    return html;

}

function solve(){

    let items=document
        .getElementById("items")
        .value
        .split(",")
        .map(Number);

    let capacity=parseFloat(
        document.getElementById("capacity").value
    );

    if(items.some(isNaN)||isNaN(capacity)){

        alert("Invalid Input");

        return;

    }

    let lower=Math.ceil(
        items.reduce((a,b)=>a+b,0)/capacity
    );

    let ff=firstFit(items,capacity);

    let ffd=firstFitDecreasing(items,capacity);

    let bfd=bestFitDecreasing(items,capacity);

    let html="";

    html+="<div class='section'>";

    html+="<h2>Input</h2>";

    html+="Items : "+items.join(", ")+"<br>";

    html+="Capacity : "+capacity+"<br>";

    html+="Sum of Items : "+items.reduce((a,b)=>a+b,0).toFixed(2)+"<br>";

    html+="Lower Bound : "+lower;

    html+="</div>";

    html+=display("First Fit (FF)",ff,capacity);

    html+=display("First Fit Decreasing (FFD)",ffd,capacity);

    html+=display("Best Fit Decreasing (BFD)",bfd,capacity);

    html+="<div class='summary'>";

    html+="<b>Summary</b><br><br>";

    html+="Lower Bound : "+lower+"<br>";

    html+="First Fit : "+ff.length+" bins<br>";

    html+="First Fit Decreasing : "+ffd.length+" bins<br>";

    html+="Best Fit Decreasing : "+bfd.length+" bins";

    html+="</div>";

    document.getElementById("output").innerHTML=html;

}

</script>

</body>
</html>
